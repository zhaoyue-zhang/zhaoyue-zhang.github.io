{{ define "main" }}
<article class="post-single">
  <header>
    <h1>{{ .Title }}</h1>
    <time>{{ .Date.Format "2006-01-02" }}</time>
    {{ if .Params.description }}<p class="desc">{{ .Params.description }}</p>{{ end }}
  </header>
  <section class="content">
    {{ .Content }}
  </section>
</article>
{{ end }}
