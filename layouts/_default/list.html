{{ define "main" }}
<h1>{{ .Title }}</h1>
<div class="post-list">
  {{ range .Pages }}
  <article class="post-card">
    <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    <time>{{ .Date.Format "2006-01-02" }}</time>
    <p>{{ .Description | default (truncate 120 .Plain) }}</p>
  </article>
  {{ end }}
</div>
{{ end }}
