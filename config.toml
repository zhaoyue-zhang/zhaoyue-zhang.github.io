baseurl = "https://zhaoyue-zhang.github.io/"
defaultContentLanguage = "zh"
languageCode = "zh-CN"
title = "照悦的博客 & 简历"
description = "记录思考，分享技术，展示成长"
author = "照悦"
theme = "PaperMod"

[languages]
  [languages.zh]
    weight = 1
    languageName = "中文"
    [languages.zh.params]
      languageAltTitle = "中文"
    [languages.zh.menu]
      [[languages.zh.menu.main]]
        name = "首页"
        url = "/"
        weight = 1
      [[languages.zh.menu.main]]
        name = "博客"
        url = "/posts/"
        weight = 2
      [[languages.zh.menu.main]]
        name = "简历"
        url = "/cv/"
        weight = 3
      [[languages.zh.menu.main]]
        name = "标签"
        url = "/tags/"
        weight = 4

  [languages.en]
    weight = 2
    languageName = "English"
    title = "Zhaoyue's Blog & CV"
    description = "Share thoughts, tech, and growth"
    author = "Zhaoyue"
    [languages.en.params]
      languageAltTitle = "English"
    [languages.en.menu]
      [[languages.en.menu.main]]
        name = "Home"
        url = "/en/"
        weight = 1
      [[languages.en.menu.main]]
        name = "Posts"
        url = "/en/posts/"
        weight = 2
      [[languages.en.menu.main]]
        name = "CV"
        url = "/en/cv/"
        weight = 3
      [[languages.en.menu.main]]
        name = "Tags"
        url = "/en/tags/"
        weight = 4

[params]
  env = "production"
  googleAnalytics = ""

# Hugo chroma syntax highlighting:
# noClasses=false  → 输出 <span class="..."> 而不是 inline style，
#                   这样外层 .content pre 的浅色背景能正常生效，
#                   也让我们自己的 token 颜色覆写可以起作用。
# style=github     → 使用 github light 主题作为 base。
[markup]
  [markup.highlight]
    noClasses = false
    style = "github"
    tabWidth = 4
  DisqusShortname = ""
  # Social links
  [[params.social]]
    name = "GitHub"
    url = "https://github.com/zhaoyue-zhang"
  [[params.social]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/yourname"
